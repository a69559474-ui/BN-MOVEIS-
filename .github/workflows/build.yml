name: Build BN MOVEIS APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - run: |
          sudo apt-get update && sudo apt-get install -y imagemagick fonts-dejavu-core
          flutter create temp_app --project-name bn_moveis --org com.bn
          cp pubspec.yaml temp_app/pubspec.yaml
          cp -r lib/* temp_app/lib/
          cd temp_app
          convert -size 512x512 xc:"#000000" -font "DejaVu-Sans-Bold" -fill "#E50914" -gravity center -pointsize 230 -annotate +0-35 "BN" -wave -8x512 -gravity center -fill "#FFFFFF" -pointsize 42 -annotate +0+125 "MOVEIS" logo.png
          flutter pub get
          dart run flutter_launcher_icons
          flutter build apk --release --no-tree-shake-icons
      - uses: actions/upload-artifact@v4
        with:
          name: BN-MOVEIS-APK
          path: temp_app/build/app/outputs/flutter-apk/app-release.apk





